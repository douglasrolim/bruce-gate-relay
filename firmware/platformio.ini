; Host-side unit tests for the gate_relay module (no hardware needed):
;   python -m platformio test -e native
; The firmware itself is built inside the Bruce tree: see scripts/gate_relay_fw.py.

[platformio]
src_dir = gate_relay
test_dir = test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<GateNames.cpp> +<Protocol.cpp> +<RelayCore.cpp> +<WsUrl.cpp>
build_flags = -std=gnu++17 -Wall -Wextra -DARDUINOJSON_ENABLE_STD_STRING=1
lib_deps = bblanchon/ArduinoJson@7.4.2
